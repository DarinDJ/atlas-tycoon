# One-command local run:  docker compose up --build   ->  http://localhost:8080
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      PORT: 3001
      DB_PATH: /data/bharat.db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      PUBLIC_URL: http://localhost:8080
      TRUST_PROXY: "true"
      STORE_DEV_MODE: "true"
      ADS_ENABLED: "false"
      ANALYTICS_ADAPTER: console
    volumes:
      - gamedata:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
  # Optional: Postgres for a multi-node deployment (adapter stub in packages/server/src/storage/postgres.ts)
  # postgres:
  #   image: postgres:16-alpine
  #   environment: { POSTGRES_PASSWORD: tycoon, POSTGRES_DB: tycoon }
  #   volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  gamedata:
