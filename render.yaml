# Render Blueprint. Free tier: no disk (leaderboard resets on redeploy), spins down after 15 min idle.
# Upgrade to plan: starter and add the disk block back for persistent data.
services:
  - type: web
    name: atlas-tycoon-server
    runtime: docker
    dockerfilePath: packages/server/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/atlas.db
      - key: TRUST_PROXY
        value: "true"
      - key: ANALYTICS_ADAPTER
        value: noop
      - key: STORE_DEV_MODE
        value: "false"
      - key: CONNECT_RATE_PER_IP
        value: "10"
      - key: CORS_ORIGINS
        value: https://darindj.github.io
      - key: PUBLIC_URL
        value: https://darindj.github.io/atlas-tycoon
# Persistent option (paid):
