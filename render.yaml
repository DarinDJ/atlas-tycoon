services:
  - type: web
    name: atlas-tycoon-server
    runtime: docker
    dockerfilePath: packages/server/Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: gamedata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/atlas.db
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
